---
name: Unit Testing

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Classify changed files
      id: scope
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python3 scripts/ci_runtime_changes.py >> "$GITHUB_OUTPUT"
    - name: Set up Python
      if: steps.scope.outputs.runtime == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - name: Install uv
      if: steps.scope.outputs.runtime == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install dependencies
      if: steps.scope.outputs.runtime == 'true'
      run: uv pip sync --system --strict requirements.test
    - name: pytest
      if: steps.scope.outputs.runtime == 'true'
      run: pytest -vvv
      env:
        PYTHONPATH: .
    - name: Panel JavaScript tests
      if: steps.scope.outputs.runtime == 'true'
      run: |
        for file in tests/*.cjs; do
          node "$file" || exit "$?"
        done
    - name: Documentation-only change
      if: steps.scope.outputs.runtime == 'false'
      run: echo 'Documentation/images only; runtime tests are unchanged and are not rerun.'
